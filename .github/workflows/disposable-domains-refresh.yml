# Weekly refresh of backend/assets/disposable-email-domains.txt from
# disposable/disposable-email-domains. Pins the download to upstream's current
# commit, records that commit in the file header, and opens (or updates) a PR
# into dev when the domain list changed. The server embeds the file at build time,
# so a merged refresh ships with the next release.
name: Disposable Domains Refresh

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          # RELEASE_TOKEN rather than GITHUB_TOKEN, so the push and the PR run CI.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download the list at upstream's current commit
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: disposable/disposable-email-domains
          LIST: backend/assets/disposable-email-domains.txt
        run: |
          SHA=$(gh api "repos/${UPSTREAM}/commits/master" --jq .sha)
          DATE=$(gh api "repos/${UPSTREAM}/commits/${SHA}" --jq .commit.committer.date)
          curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM}/${SHA}/domains.txt" \
            -o "$RUNNER_TEMP/domains.txt"

          # A truncated or failed download must not wipe the list.
          COUNT=$(grep -c . "$RUNNER_TEMP/domains.txt")
          if [ "$COUNT" -lt 50000 ]; then
            echo "::error::Upstream domains.txt has only ${COUNT} lines; refusing to replace the list."
            exit 1
          fi

          if diff -q <(grep -v "^#" "$LIST") <(grep -v "^#" "$RUNNER_TEMP/domains.txt") > /dev/null; then
            echo "Domain list unchanged at ${SHA}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "# Disposable email domains, refused at Scanopy Cloud sign-up alongside the mailchecker crate."
            echo "# Source: https://github.com/${UPSTREAM} (domains.txt)"
            echo "# Upstream commit: ${SHA} (${DATE})"
            echo "# License: MIT. Copyright (c) 2017 Andrei Simionescu; Copyright (c) 2017 Stefan Meinecke, greenSec GmbH."
            echo "# .github/workflows/disposable-domains-refresh.yml rewrites this file weekly. Add a domain"
            echo "# flagged by mistake to disposable-email-allowlist.txt instead of editing it here."
            cat "$RUNNER_TEMP/domains.txt"
          } > "$LIST"

          {
            echo "changed=true"
            echo "sha=${SHA}"
            echo "count=${COUNT}"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh PR
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA: ${{ steps.fetch.outputs.sha }}
          COUNT: ${{ steps.fetch.outputs.count }}
          LIST: backend/assets/disposable-email-domains.txt
        run: |
          BRANCH="chore/disposable-email-domains"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$LIST"
          git commit -m "chore: refresh disposable email domains (${SHA:0:7})"
          git push --force origin "$BRANCH"

          {
            echo "Refreshes \`${LIST}\` from disposable/disposable-email-domains at ${SHA}: ${COUNT} domains."
            echo ""
            echo "- [ ] Skim the diff for a real company's domain. Add any to \`backend/assets/disposable-email-allowlist.txt\` instead of removing it here."
          } > "$RUNNER_TEMP/pr_body.md"

          if [ -n "$(gh pr list --head "$BRANCH" --base dev --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr_body.md"
            echo "Updated the open PR for $BRANCH"
          else
            gh pr create --base dev --head "$BRANCH" \
              --title "Refresh disposable email domains" \
              --body-file "$RUNNER_TEMP/pr_body.md"
          fi
