# cargo-about: the licences Scanopy accepts from the crates it ships. `make third-party-notices`
# renders about.hbs into THIRD-PARTY-NOTICES.txt, and server-ci runs the same generation on every
# PR, so a crate under a licence not listed here (GPL, LGPL, AGPL, EPL, SSPL...) fails the build.
# For an `OR` expression the first accepted term is used.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MITNFA",
    # File-level copyleft: dyn-eq, webpki-roots 0.25, and fast_chemail/ascii_utils via mailchecker.
    # Shipped unmodified; about.hbs names where their source is.
    "MPL-2.0",
]

# Every target a release builds (release.yml), so platform-only crates are listed.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-freebsd",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

# Skips scanopy-server itself (`publish = false`).
private = { ignore = true }

workarounds = ["ring"]
